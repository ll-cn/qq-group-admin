# ===================== 官方群管插件配置 =====================
# 改完保存即时生效（每次指令都会检查文件是否变动，不用重启）。
# 删掉本文件后，下次启动会自动重新生成这份默认配置。

# 配置版本（插件用它自动升级配置项，一般不用管）
configVersion: 1

# 额外管理员：群成员 openid 列表（机器人主人始终可用）
# 取 openid 的办法：在群里发「#群成员 openid」，列表里带的就是
admins: []

# 默认禁言时长（秒）
defaultMuteSeconds: 600

# 单次最长禁言时长（秒）。官方上限 30 天，不要调大
maxMuteSeconds: 2592000

# 处置后回查一次，确认禁言真的生效（多一次请求，建议开着）
verifyAfterMute: true

# 群成员列表缓存时间（秒）
memberCacheSeconds: 600

# 群成员列表最多翻几页（每页 30 人）。白名单机器人才能用，否则会报 11253
memberMaxPages: 4

# 自动群管：每个群可用「#群管开关」单独开关，这里只是各群的初始默认值
auto:
  enabled: false
  # 刷屏判定：floodSeconds 秒内发言超过 floodCount 条
  floodSeconds: 10
  floodCount: 8
  # 刷屏处置：禁言秒数（0 = 只警告）
  floodMuteSeconds: 600
  # 违禁词处置：禁言秒数（0 = 只提醒）
  bannedMuteSeconds: 600
  # 违禁词列表（区分大小写；命中即处理）
  words: []

# 入群申请：机器人是群管理员才能收到官方推送
joinRequest:
  # 有人申请加群时在群里发通知
  notify: true
  # 通知带「通过 / 拒绝」按钮
  buttons: true

  # ============ 通知文案（怎么填看这里）============
  # 一行一项，可以增删、调顺序、改措辞。
  # 唯一要记住的语法：{变量名} 会被替换成实际内容。
  #
  # 可用变量：
  #   {name}     申请人昵称
  #   {verify}   验证消息
  #   {qa}       问题与答案（最多 3 组，会展开成多行）
  #   {source}   来源：主动申请 / 被邀请（附邀请人）
  #   {risk}     风险提示
  #   {bot}      机器人账号提示
  #
  # 另外还有 {openid}（完整）和 {openid8}（前 8 位），
  # 默认模板不显示，需要核对身份时自己在 template 里加一行。
  #
  # 规则：
  #   1. 一行里用到的变量全为空时，这一行不显示
  #      （所以没填验证消息的人，不会留一个空的「验证消息：」）
  #   2. 空字符串行会保留成空行，用来分段
  #
  # 例子 A：只想看昵称和验证消息
  #   template:
  #     - "有人申请加群"
  #     - "申请人：{name}"
  #     - "验证：{verify}"
  #
  # 例子 B：只想看验证消息和问答
  #   template:
  #     - "有人申请加群"
  #     - "验证：{verify}"
  #     - "{qa}"
  #
  # 注意：以 * 开头的行必须用引号包起来，
  #      否则 YAML 会把它当成别名，整份配置解析失败。
  template:
    - "**有新成员申请加群**"
    - ""
    - "昵称：{name}"
    - "验证消息：{verify}"
    - "{qa}"
    - "来源：{source}"
    - "风险：{risk}"
    - "{bot}"

# 入群欢迎（默认关闭；{user} 会替换成「@新成员」）
welcome:
  enabled: false
  text: "欢迎 {user} 加入本群，先看看群公告哦～"
